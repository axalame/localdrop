<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Clean Apple-style vertical blue gradient -->
    <linearGradient id="appleBlue" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0077ed"/>
      <stop offset="100%" stop-color="#005ec4"/>
    </linearGradient>
    
    <!-- Subtle top reflection highlight -->
    <linearGradient id="highlight" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.3"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>

    <!-- Natural soft drop shadow for foreground icon -->
    <filter id="iconShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="8" stdDeviation="10" flood-color="#001f4d" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Base Squircle -->
  <rect x="20" y="20" width="472" height="472" rx="112" fill="url(#appleBlue)"/>
  
  <!-- Subtle inner top highlight border -->
  <rect x="21" y="21" width="470" height="470" rx="111" fill="none" stroke="url(#highlight)" stroke-width="3"/>

  <!-- Iconic Transfer / Clipboard Symbol in Clean White -->
  <g filter="url(#iconShadow)">
    <!-- Clipboard Outline -->
    <rect x="156" y="146" width="200" height="248" rx="32" fill="#ffffff"/>
    
    <!-- Top Clip -->
    <rect x="206" y="120" width="100" height="48" rx="14" fill="#005ec4"/>
    <circle cx="256" cy="144" r="8" fill="#ffffff"/>

    <!-- Subtle document horizontal guide line -->
    <rect x="194" y="200" width="124" height="14" rx="7" fill="#e2e8f0"/>

    <!-- Transfer Dynamic Wave / Arrows (AirDrop inspired) -->
    <!-- Two bidirectional sleek arrows in Apple Blue -->
    <!-- Top arrow: pointing right -->
    <path d="M210 252 L284 252 M272 240 L286 252 L272 264" fill="none" stroke="#0077ed" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Bottom arrow: pointing left -->
    <path d="M302 300 L228 300 M240 288 L226 300 L240 312" fill="none" stroke="#005ec4" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>

    <!-- Base device status dot -->
    <circle cx="256" cy="354" r="6" fill="#cbd5e1"/>
  </g>
</svg>