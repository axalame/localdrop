[package]
name = "localdrop"
version = "0.1.0"
description = "LocalDrop - Local Clipboard & File Sharing between iPhone and Windows"
authors = ["LocalDrop Team"]
edition = "2024"
rust-version = "1.90"

[lib]
name = "localdrop_lib"
crate-type = ["rlib"]

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12.5", features = ["image-png", "image-ico"] }
tauri-plugin-clipboard-manager = "2"
tauri-plugin-notification = "2"
tauri-plugin-opener = "2"
axum = { version = "0.8", features = ["ws", "multipart"] }
tokio = { version = "1", features = ["full"] }
tower-http = { version = "0.6", features = ["cors", "fs", "trace"] }
tower = "0.5"
futures-util = "0.3"
local-ip-address = "0.6"
arboard = "3.4"
qrcode = "0.14"
directories = "5.0"
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1", features = ["v4", "serde"] }
image = { version = "0.25", default-features = false, features = ["png"] }
rust-embed = "8.13.0"
mime_guess = "2.0.5"

[profile.dev]
debug = 1

[profile.dev.package."*"]
debug = 0
opt-level = 2

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

